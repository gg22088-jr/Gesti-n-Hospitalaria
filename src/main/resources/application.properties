spring.application.name=gestion-hospitalaria
server.port=8080

# --- Conexión MySQL (ajusta usuario/contraseña o usa variables de entorno) ---
spring.datasource.url=jdbc:mysql://localhost:3306/gestion_hospitalaria?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=Jose60226
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# --- JPA: el esquema ya lo crea tu script SQL, Hibernate no lo toca ---
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.show-sql=true
# Respeta los nombres exactos de tablas/columnas del script (Usuario, Empleado, ...)
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.time-zone=America/El_Salvador

# --- Seguridad JWT ---
# En produccion define la variable de entorno JWT_SECRET (minimo 32 caracteres)
app.jwt.secret=${JWT_SECRET:cambia-esta-clave-secreta-de-desarrollo-sigpmat-2026-0123456789}
app.jwt.expiration-minutes=480
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration

# --- IA para analizar reportes (opcional) ---
# Sin clave se usa un análisis básico automático (sin IA). Para activar la IA, define la variable de entorno IA_API_KEY.
# Al servicio de IA solo se envían cifras del reporte, con las personas anonimizadas (E01, E02...).
app.ia.api-key=${IA_API_KEY:}
# Proveedor: openai o anthropic. Si se deja vacío se detecta por la clave (las que empiezan con sk-ant- son de Anthropic; las demás, de OpenAI).
app.ia.proveedor=${IA_PROVEEDOR:}
# Modelo (vacío = el modelo económico por defecto del proveedor). Si da error, pon el nombre de un modelo disponible en tu cuenta.
app.ia.modelo=${IA_MODELO:}
app.ia.url=${IA_URL:}
app.ia.timeout-segundos=30
